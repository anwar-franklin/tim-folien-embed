<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wissensprüfung im Frame</title>
<link rel="stylesheet" href="deck.css">
<link rel="alternate" type="application/json+oembed" href="https://anwar-franklin.github.io/tim-folien-embed/oembed/03.json">
</head>
<body>
<div class="slide">
  <img class="logo" src="assets/franklin-logo-2026.svg" alt="Franklin Institute">
  <div class="safe">
    <p class="kicker">Wissensprüfung</p>
    <h1 class="h1">Prüfe die Folie <span class="accent">direkt</span></h1>
    <p class="lead">Wähle eine Antwort. Die Folie wertet sofort aus.</p>
  </div>
  <div class="stage">
    <div class="mitte">
      <div class="quiz">
        <p class="frage" id="frage">Was unterscheidet diese Folie von einem Screenshot im Frame?</p>
        <div class="optionen" id="optionen" role="group" aria-labelledby="frage">
          <button type="button" data-richtig="false">
            <span class="marke" aria-hidden="true">A</span>
            <span>Sie liegt in höherer Auflösung vor.</span>
          </button>
          <button type="button" data-richtig="true">
            <span class="marke" aria-hidden="true">B</span>
            <span>Sie führt eigenen Code aus und reagiert auf Eingaben.</span>
          </button>
          <button type="button" data-richtig="false">
            <span class="marke" aria-hidden="true">C</span>
            <span>Sie lässt sich im Board verschieben.</span>
          </button>
        </div>
        <p class="befund" id="befund" role="status" aria-live="polite">
          <span id="befundtext"></span>
          <button type="button" class="neu" id="neu" hidden>Noch einmal</button>
        </p>
      </div>
    </div>
    <div class="bodennote">
      <span class="case"><b>Merksatz:</b> Ein Bild zeigt eine Folie. Eine Seite <b>ist</b> die Folie.</span>
    </div>
  </div>
</div>
<script src="fit.js"></script>
<script>
(function () {
  var optionen = document.getElementById('optionen');
  var knoepfe = Array.prototype.slice.call(optionen.querySelectorAll('button'));
  var befundtext = document.getElementById('befundtext');
  var neu = document.getElementById('neu');

  function zuruecksetzen() {
    knoepfe.forEach(function (b) {
      b.className = '';
      b.disabled = false;
      b.removeAttribute('aria-pressed');
    });
    befundtext.textContent = '';
    neu.hidden = true;
    knoepfe[0].focus();
  }

  function auswerten(gewaehlt) {
    var richtig = gewaehlt.dataset.richtig === 'true';
    knoepfe.forEach(function (b) {
      b.disabled = true;
      if (b === gewaehlt) b.className = richtig ? 'richtig' : 'falsch';
      else if (b.dataset.richtig === 'true') b.className = 'richtig';
      else b.className = 'aus';
    });
    gewaehlt.setAttribute('aria-pressed', 'true');
    befundtext.innerHTML = richtig
      ? '<b>Richtig.</b> Der Frame trägt eine laufende Seite, kein Standbild.'
      : '<b>Nicht ganz.</b> Antwort B trifft es: Die Seite führt Code aus.';
    neu.hidden = false;
  }

  knoepfe.forEach(function (b) {
    b.addEventListener('click', function () { auswerten(b); });
  });
  neu.addEventListener('click', zuruecksetzen);
})();
</script>
</body>
</html>
